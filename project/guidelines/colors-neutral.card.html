<!-- @dsCard group="Colors" viewport="700x180" subtitle="Warm off-whites, beiges, borders, text" name="Neutral Palette" -->
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:16px;background:var(--bg-page);}
  .row{display:flex;gap:8px;}
  .swatch{flex:1;height:88px;border-radius:var(--radius-md);border:1px solid var(--border-default);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;}
  .swatch span{font-family:var(--font-mono);font-size:11px;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:var(--color-white);"><span>white<br>#FFFFFF</span></div>
    <div class="swatch" style="background:var(--color-warm-bg);"><span>warm bg<br>#FAF7F2</span></div>
    <div class="swatch" style="background:var(--color-surface-muted);"><span>surface muted<br>#F6F1EA</span></div>
    <div class="swatch" style="background:var(--color-border-light);"><span>border light<br>#E7E1D8</span></div>
    <div class="swatch" style="background:var(--color-border-medium);"><span>border medium<br>#D6CBBF</span></div>
  </div>
</body>
</html>
