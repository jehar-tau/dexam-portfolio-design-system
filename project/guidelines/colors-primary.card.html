<!-- @dsCard group="Colors" viewport="700x180" subtitle="Earthy orange — primary accent scale" name="Primary Orange" -->
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:16px;background:var(--bg-page);}
  .row{display:flex;gap:8px;}
  .swatch{flex:1;height:88px;border-radius:var(--radius-md);border:1px solid var(--border-default);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;}
  .swatch span{font-family:var(--font-mono);font-size:11px;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:var(--color-primary-extra-soft);"><span>extra-soft<br>#FBF1E8</span></div>
    <div class="swatch" style="background:var(--color-primary-soft);"><span>soft<br>#F4E2D3</span></div>
    <div class="swatch" style="background:var(--color-primary);color:#fff;"><span>primary<br>#C76A2D</span></div>
    <div class="swatch" style="background:var(--color-primary-hover);color:#fff;"><span>hover<br>#A95522</span></div>
    <div class="swatch" style="background:var(--color-primary-active);color:#fff;"><span>active<br>#8F461B</span></div>
  </div>
</body>
</html>
