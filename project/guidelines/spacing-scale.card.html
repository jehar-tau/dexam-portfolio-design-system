<!-- @dsCard group="Spacing" viewport="700x180" subtitle="4 → 96px block-based scale" name="Spacing Scale" -->
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:16px;background:var(--bg-page);}
  .row{display:flex;align-items:flex-end;gap:10px;height:110px;}
  .bar{background:var(--color-primary);border-radius:2px 2px 0 0;width:22px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);}
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px;"></div>4</div>
    <div class="col"><div class="bar" style="height:8px;"></div>8</div>
    <div class="col"><div class="bar" style="height:12px;"></div>12</div>
    <div class="col"><div class="bar" style="height:16px;"></div>16</div>
    <div class="col"><div class="bar" style="height:20px;"></div>20</div>
    <div class="col"><div class="bar" style="height:24px;"></div>24</div>
    <div class="col"><div class="bar" style="height:32px;"></div>32</div>
    <div class="col"><div class="bar" style="height:48px;"></div>48</div>
    <div class="col"><div class="bar" style="height:64px;"></div>64</div>
    <div class="col"><div class="bar" style="height:96px;"></div>96</div>
  </div>
</body>
</html>
