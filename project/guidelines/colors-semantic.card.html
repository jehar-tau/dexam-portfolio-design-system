<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:16px;background:var(--bg-page);}
  .row{display:flex;gap:8px;}
  .pill{flex:1;height:64px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:500;}
</style>
</head>
<body>
  <div class="row">
    <div class="pill" style="background:var(--color-success-soft);color:var(--color-success);">Success</div>
    <div class="pill" style="background:var(--color-warning-soft);color:var(--color-warning);">Warning</div>
    <div class="pill" style="background:var(--color-danger-soft);color:var(--color-danger);">Danger</div>
    <div class="pill" style="background:var(--color-info-soft);color:var(--color-info);">Info</div>
  </div>
</body>
</html>
